{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Backoffice{% endblock %} · Freyja</title>
    <link rel="stylesheet" href="{% static 'backoffice/backoffice.css' %}?v=20260810-2">
</head>
<body>
    <div class="page-glow" aria-hidden="true"></div>
    <div class="shell">
        <header class="topbar">
            <a class="brand" href="{% url 'backoffice:index' %}" aria-label="Freyja backoffice home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 20V8.5A4.5 4.5 0 0 1 11.5 4H19M7 11h8" /></svg>
                </span>
                <span>Freyja <strong>Backoffice</strong></span>
            </a>
            <div class="account">
                <span>{{ request.user.email }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Sign out</button>
                </form>
            </div>
        </header>

        <div class="workspace">
            <nav class="sidebar" aria-label="Backoffice navigation">
                <p class="nav-label">Manage</p>
                <a class="nav-item {% block users_nav_class %}{% endblock %}" href="{% url 'backoffice:users_list' %}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" /></svg>
                    Users
                </a>
            </nav>
            <main class="content">{% block content %}{% endblock %}</main>
        </div>
    </div>
</body>
</html>
